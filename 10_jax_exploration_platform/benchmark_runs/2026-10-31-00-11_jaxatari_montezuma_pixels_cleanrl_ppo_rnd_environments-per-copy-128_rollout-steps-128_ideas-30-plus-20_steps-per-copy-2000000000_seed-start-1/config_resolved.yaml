environment: jaxtari_montezuma_pixels
reset_mode: native_immediate
policy_copies: measured
environments_per_copy: 128
rollout_steps: 128
minibatches: 4
epochs: 4
learning_rate: 0.0001
anneal_learning_rate: true
adam_epsilon: 0.00001
extrinsic_discount: 0.999
intrinsic_discount: 0.99
generalized_advantage_estimation_parameter: 0.95
policy_clip_coefficient: 0.1
entropy_coefficient: 0.001
value_coefficient: 0.5
joint_gradient_norm_limit: 0.5
predictor_update_fraction: 0.25
intrinsic_advantage_weight: 1.0
extrinsic_advantage_weight: 2.0
normalization_warmup_rollouts: 50
network_precision: float32
statistics_precision: float64
allow_reduced_precision: false
training_updates: 122070
checkpoint_interval_seconds: 1200
monitor_interval_seconds: 1200
# Timing protocol; each complete update retains the learner settings above.
paired_timing_rounds: 7
paired_timing_minimum_complete_updates_per_round: 1
paired_timing_grouped_complete_updates_per_round: 5
paired_timing_report_complete_updates_per_round: 10
selected_combination_confirmation_paired_rounds: 7
selected_combination_confirmation_complete_updates_per_round: 10
