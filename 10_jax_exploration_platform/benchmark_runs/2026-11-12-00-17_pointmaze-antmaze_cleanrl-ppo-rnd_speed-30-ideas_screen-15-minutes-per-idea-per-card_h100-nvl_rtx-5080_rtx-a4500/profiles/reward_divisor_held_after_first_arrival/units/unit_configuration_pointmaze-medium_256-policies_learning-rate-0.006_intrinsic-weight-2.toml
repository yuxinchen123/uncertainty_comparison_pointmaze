# Unit validation-block_pointmaze-medium_reward-arrival-plus-one_divisor-held-after-one-sixteenth_learning-rate-0.006_entropy-coefficient-0.01_intrinsic-weight-2.0_clip-coefficient-0.1_seeds-10000-to-10255
# Written by scripts/maze_campaign/build_units.py from configs/experiments/pointmaze_large_cleanrl-ppo-rnd_goal-termination_reward-arrival-plus-one_example_steps-1024000.toml; the changed values are listed in the unit's specification file.
# Example of the PointMaze and AntMaze study that started 2026-11-11: one file starts one run.
# Learner: CleanRL PPO with random network distillation (clipped update, 4 epochs x 4 minibatches,
# clip 0.1, learning rate 1e-4 annealed to zero over the run, entropy 0.001, 50 random-action
# rollouts before training). The episode ends at the goal. Reward setting arrival_plus_one pays 1
# on arrival; add `--reward-setting step_cost` to the command for a cost of 1 / (step limit) per
# step instead. Every trainer and environment value is written here; none is inherited at load time.

[metadata]
name = "beat-cleanrl-ppo-rnd-auto-research, validation-block: divisor-held-after-one-sixteenth on pointmaze-medium, reward setting arrival plus one, cells 1 to 1 of 2, seeds 10000 to 10255"
implementation = "jax_exploration_platform"
environment_family = "pointmaze"
source_files = [
  "07_reconstruction/ppo_rnd_envpool.py",
  ".claude/rules/exploration-metrics-pointmaze-antmaze.md",
]
notes = "Learner values are CleanRL's defaults in the first source file, except that the predictor trains on the whole batch. Environment, goal termination and the two reward settings are defined in the second source file. A small run for a first check: 16 policies on seeds 0 to 15, 4 environments each."
source_steps_per_policy_copy = 1024000

[trainer]
configuration_preset = "pointmaze_current"
intrinsic_bootstrap_observation = "reset_observation"
no_bonus_advantage_stream = "task_only"
n_copies = 256
n_envs = 4
num_steps = 128
update_style = "epoch_minibatch"
flat_params = false
update_epochs = 4
num_minibatches = 4
learning_rate = 0.0001
adam_eps = 1e-05
anneal_lr = true
gamma_ext = 0.999
gamma_int = 0.99
gae_lambda = 0.95
clip_coef = 0.1
ent_coef = 0.001
vf_coef = 0.5
max_grad_norm = 0.5
int_coef = 1.0
ext_coef = 2.0
prime_iterations = 50
bootstrap_on_truncation = true
base_seed = 0
hoist_rollout = true
scan_unroll = 0
update_unroll = 2
batch_stats_f32 = false
learning_rates = []
betas = []
parameter_settings = [[0.006, 0.01, 2.0, 0.1]]
copies_per_group = 256
sweep_seed_mode = "paired"
copy_seed_offset = 10000
track_coverage = true
diagnostics = false
total_iterations = 0
int_coef_schedule = "constant"
success_gate_rate = 0.0
normalize_ext_reward = false
clip_per_network = false
logstd_floor = -inf
critic_lr_scale = 1.0
normalize_agent_obs = false
setting_names = ["learning_rate", "ent_coef", "int_coef", "clip_coef"]
ext_reward_scale = 1.0
ext_reward_offset = 0.0
episode_log = true
gather_minibatches_per_epoch = false
target_features_once_per_iteration = false
permutation_draw = "argsort_uniform"
next_values_from_shifted_values = false
skip_reset_draws_at_zero_noise = false
intrinsic_sums_by_matrix_product = false
advantage_scan_unroll = 1
action_noise_generator = "threefry"
actor_critic_joint_trunk = false

[environment]
map_name = "medium"
start_cell = [6, 1]
goal_cell = [1, 6]
position_noise = 0.0
max_episode_steps = 400
continuing_task = false
reward_shift = 0.0
goal_radius = 0.45
goal_reward = "per_step"

[runtime]
environment = "pointmaze-large"
bonus = "rnd_next_state"
iterations = 2048
window_iterations = 8
run_seed = 1470928785
lr_anneal_iterations = 2048
reward_setting = "arrival_plus_one"
