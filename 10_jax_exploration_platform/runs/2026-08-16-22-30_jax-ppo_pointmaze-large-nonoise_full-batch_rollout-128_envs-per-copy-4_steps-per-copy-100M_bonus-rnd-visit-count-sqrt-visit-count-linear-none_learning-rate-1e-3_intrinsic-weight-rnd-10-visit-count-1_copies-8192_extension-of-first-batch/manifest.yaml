description: "The extension of train run 1.1. Four work units, one per algorithm arm, each holding the single configuration that arm won with in the parent run: random network distillation at intrinsic weight 10, the two oracle visit-count bonuses at intrinsic weight 1, and no bonus at all, every one at learning rate 1e-3. 8,192 copies per unit, seeded 0 to 8,191, 100,044,800 environment steps per copy."
git:
