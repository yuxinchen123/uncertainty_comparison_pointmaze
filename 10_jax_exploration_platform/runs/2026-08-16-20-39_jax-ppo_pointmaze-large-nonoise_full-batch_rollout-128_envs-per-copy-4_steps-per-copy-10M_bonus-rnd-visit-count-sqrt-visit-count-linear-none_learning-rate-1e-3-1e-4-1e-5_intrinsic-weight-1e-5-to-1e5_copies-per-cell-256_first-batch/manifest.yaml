description: >
  The platform's first science run. Four algorithm arms on the no-noise large PointMaze, each a
  separate compiled program and a separate work unit: random network distillation, the two oracle
  visit-count bonuses, and no bonus at all. Every arm sweeps three learning rates; the three arms
  that have a bonus also sweep eleven weights on it. 256 copies per cell, seeded in pairs across
  cells, 10,035,200 environment steps per copy.
