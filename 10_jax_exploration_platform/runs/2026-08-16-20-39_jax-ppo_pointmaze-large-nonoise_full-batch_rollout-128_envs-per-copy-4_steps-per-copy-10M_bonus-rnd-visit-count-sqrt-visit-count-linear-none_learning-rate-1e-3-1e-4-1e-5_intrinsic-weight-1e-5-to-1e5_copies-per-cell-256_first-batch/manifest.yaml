  agent: ppo_full_batch@1
  bonus: rnd_next_state@1 + gt_position_velocity_sqrt@1 + gt_position_velocity_linear@1 + none@1
  update_schedule: post_rollout_update@1 for the visit-count arms, per_rollout@1 for random network distillation, none@1 for the arm with no bonus
