schema_version: 1
run_id: 2026-08-16-15-28_gpu_node_throughput_survey_jax-ppo-rnd_single-update_pointmaze-large_copies-512-1024-2048-4096_cpus-8-16-32_all-gpu-and-gnolim-node-classes
description: >
  Throughput of the single-update JAX PPO+RND trainer on PointMaze Large, measured once on every
  distinct graphics-card configuration of this cluster's gpu and gnolim partitions, at 512,
  1,024, 2,048 and 4,096 training copies with 8, 16 and 32 processors. One Slurm job per
  (node class, processor count); one process per copy count inside it.
git:
  commit: a69d7bc39641887f343da39e03f60c39c35e37a1
  dirty: false
specs:
  env: pointmaze_large_batched_jax@pm_common.EnvConfig defaults, position_noise 0.0
  agent: jax_ppo_rnd.JaxPPORND@ppo/jax_ppo/jax_ppo_rnd.py
  bonus: random_network_distillation@feature_dim 128, hidden 256
  update_schedule: full_batch@one gradient step per rollout
compile_signature:
  copies: [512, 1024, 2048, 4096]
  envs_per_copy: 4
  rollout_steps: 128
  epochs: 1
  minibatches: 1
  dtype: float32
  stats_dtype: float64
seeding:
  base_seed: 0
  mode: distinct
artifacts:
  report: results.md
  measurements: data/throughput/
  reachability_probes: data/probe/
  figures: plots/
