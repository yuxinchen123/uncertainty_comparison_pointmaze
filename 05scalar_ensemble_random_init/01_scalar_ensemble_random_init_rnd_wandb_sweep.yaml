program: 01_scalar_ensemble_random_init_rnd_only.py
project: scalar-ensemble-random-init-rnd
method: grid
metric:
  goal: minimize
  name: final_mean_l2_errors
parameters:
  a_seed:
    values: [0, 1, 2, 3, 4]
  num_heads:
    values: [10, 100]
  num_samples:
    values: [100, 1000, 10000]
  num_averaging_runs:
    value: 1
  output_dim:
    values: [128, 512]
  hidden_dims:
    value: "128,128"
  num_epochs:
    values: [1, 10, 20]
  gaussian_noise:
    values: [0.0, 0.5]
  grid_rows:
    value: 9
  grid_cols:
    value: 12
  device:
    value: "cpu"
  wandb_switch:
    value: "True"

