program: 03_scalar_ensemble_noise_rnd_linear_ls.py
project: scalar-ensemble-rnd-linear-ls
method: grid
metric:
  goal: minimize
  name: final_mean_l2_predictions
parameters:
  num_heads:
    values: [10, 100]
  num_samples:
    values: [100, 1000, 10000]
  num_averaging_runs:
    value: 1
  phi_dim:
    values: [128, 512]
  regularization:
    values: [0.01, 0.1, 1.0]
  num_epochs:
    value: 1
  noise_sigma:
    values: [0.5, 1.0, 2.0]
  grid_rows:
    value: 9
  grid_cols:
    value: 12
  device:
    value: "cpu"
  a_seed:
    values: [0, 1, 2, 3, 4]
  wandb_switch:
    value: "True"

