program: 04_ensemble_rnd_linear_ls.py
project: ensemble-rnd-linear-ls
method: grid
metric:
  goal: minimize
  name: final_mean_l2
parameters:
  K:
    values: [5, 10, 15, 20]
  num_samples:
    value: 10000
  num_averaging_runs:
    value: 1
  phi_dim:
    values: [128, 512]
  regularization:
    values: [1e-2]
  num_epochs:
    value: 1
  gaussian_noise:
    values: [0.0, 0.5, 1.0]
  grid_rows:
    value: 9
  grid_cols:
    value: 12
  device:
    value: "cpu"
  a_seed:
    values: [0, 1, 2, 3, 4]
  wandb_switch:
    value: "True"
