program: 03_ensemble_rnd_linear_sgd.py
project: ensemble-rnd-linear-sgd
method: grid
metric:
  goal: minimize
  name: final_mean_l2
parameters:
  a_seed:
    values: [0, 1, 2, 3, 4]
  K:
    # values: [5, 10, 15, 20]
    values: [15, 20]
  num_samples:
    value: 10000
  num_averaging_runs:
    value: 1
  phi_dim:
    values: [128, 512]
  num_epochs:
    values: [500, 1000]
  regularization:
    values: [1e-2]
  gaussian_noise:
    values: [0.0, 0.5, 1.0]
    # value: 0.0
  grid_rows:
    value: 9
  grid_cols:
    value: 12
  device:
    value: "cpu"
  wandb_switch:
    value: "True"
