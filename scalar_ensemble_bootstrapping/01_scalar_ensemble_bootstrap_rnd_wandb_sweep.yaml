program: 01_scalar_ensemble_bootstrap_rnd_only.py
project: scalar-ensemble-bootstrap-rnd
method: grid
metric:
  goal: minimize
  name: final_mean_l2
parameters:
  a_seed:
    values: [0, 1, 2, 3, 4]
  num_heads:
    values: [5, 10, 50, 100]
  num_samples:
    values: [100, 1000, 10000]
  num_averaging_runs:
    value: 1
  output_dim:
    values: [128, 256, 512]
  hidden_dims:
    values: ["128,128", "512,512"]
  num_epochs:
    value: 30 # 30 epochs is enough for convergence
  gaussian_noise:
    values: [0.0, 0.5, 1.0]
  grid_rows:
    value: 9
  grid_cols:
    value: 12
  device:
    value: "cpu"
  wandb_switch:
    value: "True"

