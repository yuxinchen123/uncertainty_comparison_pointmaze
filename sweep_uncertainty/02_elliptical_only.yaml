program: 02_elliptical_only.py
name: elliptical_bonus_sweep
project: elliptical-bonus
description: Focused sweep of Elliptical Bonus method with comprehensive parameter exploration
method: grid
metric:
  goal: minimize
  name: avg_l2_distance
parameters:
  # Method is fixed to elliptical
  method:
    value: 'elliptical'
  
  # Feature dimension sweep - key parameter for Elliptical Bonus
  phi_dim:
    # values: [64, 128, 256, 512, 1024]
    values: [64, 128]
  
  # Regularization parameter - critical for covariance matrix stability
  regularization:
    values: [0.1, 0.5, 1.0, 5.0, 10.0]
  
  # Data sampling parameters
  num_samples:
    values: [100, 1000, 10000]
  
  # Data sampling and model initialization seeds
  a_seed:
    values: [0, 1, 2, 3, 4]
  
  # Averaging parameters
  num_averaging_runs:
    value: 10
  
  # Fixed parameters
  wandb_switch:
    value: true
  grid_rows:
    value: 9
  grid_cols:
    value: 12
  
  # These are ignored for elliptical but kept for compatibility
  gaussian_noise:
    value: 0.0
  num_epochs:
    value: 1  # Minimal since elliptical doesn't use epochs