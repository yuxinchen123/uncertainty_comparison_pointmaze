program: 03_rnd_linear_ols.py
name: rnd_linear_sweep
project: rnd-linear-ols
description: Focused sweep of RND Linear method with least squares fitting
method: grid
metric:
  goal: minimize
  name: avg_l2_distance
parameters:
  # Method is fixed to rnd_linear
  method:
    value: 'rnd_linear'
  
  # Feature dimension sweep - key parameter for RND Linear
  phi_dim:
    values: [256, 512]
  # Gaussian noise levels - critical for RND Linear exploration
  gaussian_noise:
    values: [0.0, 0.5, 1.0]
  # Regularization parameter (L2 regularization / weight decay)
  regularization:
    values: [1e-2]
  # Training parameters (not used for OLS but kept for compatibility)
  num_epochs:
    value: 1
  # Data sampling parameters
  num_samples:
    values: [100, 1000, 10000]
  # Data sampling and model initialization seeds
  a_seed:
    values: [0, 1, 2, 3, 4]
  # Averaging parameters
  num_averaging_runs:
    value: 10
  
  # Fixed parameters
  wandb_switch:
    value: true
  grid_rows:
    value: 9
  grid_cols:
    value: 12
  
  # # These are not used for rnd_linear but kept for compatibility
  # output_dim:
  #   value: 64  # Not used
  # hidden_dims:
  #   value: '64,64'  # Not used
  # regularization:
  #   value: 1e-6  # Not used