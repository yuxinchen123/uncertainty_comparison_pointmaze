program: 04_rnd_linear_sgd.py
name: rnd_linear_sgd_hyperparameter_sweep
project: rnd-linear-sgd
description: Comprehensive hyperparameter sweep for RND Linear SGD method
method: grid
metric:
  goal: minimize
  name: avg_l2_distance
parameters:
  # Method is fixed to rnd_linear
  method:
    value: 'rnd_linear'
  
  # Feature dimension sweep - key parameter for RND Linear
  phi_dim:
    values: [256, 512]
  
  # φ(s) weight seeds - test robustness to different feature mappings
  phi_seed:
    values: [0, 1, 2]
  
  # θ vector initialization seeds - test robustness to different target vectors
  theta_seed:
    values: [42, 123, 456]
  
  # Training hyperparameters - core SGD parameters
  num_epochs:
    values: [500, 1000]
  
  # Regularization parameter (L2 regularization / weight decay)
  regularization:
    values: [1e-2]
  
  # Gaussian noise levels - critical for RND Linear exploration
  gaussian_noise:
    values: [0.0, 0.5, 1.0]
  
  
  # Data sampling parameters
  num_samples:
    value: 10000  # 10K samples per run
  
  # Data sampling and model initialization seeds
  a_seed:
    values: [0, 1, 2, 3, 4]
  
  # Averaging parameters
  num_averaging_runs:
    value: 10 
  
  # Fixed parameters
  wandb_switch:
    value: true
  grid_rows:
    value: 9
  grid_cols:
    value: 12