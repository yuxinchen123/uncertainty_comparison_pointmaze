program: 08_rnd_only.py
name: rnd_sweep
project: rnd
description: Focused sweep of RND method with comprehensive parameter exploration
method: grid
metric:
  goal: minimize
  name: avg_l2_distance
parameters:
  # Method is fixed to rnd
  method:
    value: 'rnd'
  
  # RND architecture parameters
  output_dim:
    values: [128, 256]
    # values: [64, 128, 256, 512, 1024]
  hidden_dims:
    values: ['128,128', '512,512']
        # values: ['64,64', '128,128', '256,256', '512,512']
  
  # Training parameters - epoch sweep for RND
  # Analysis shows optimal at 30-50 epochs, 100 epochs shows overfitting (5% worse L2)
  num_epochs:
    values: [30, 50]  # Optimal range: 30 epochs (near-best), 50 epochs (best L2=1.37)
  
  # Gaussian noise levels
  gaussian_noise:
    values: [0.0, 0.5, 1.0]
  
  # Data sampling parameters
  num_samples:
    values: [100, 1000, 10000]  
  
  # Data sampling and model initialization seeds
  a_seed:
    values: [0, 1, 2, 3, 4]
  
  # Averaging parameters
  num_averaging_runs:
    value: 10
  
  # Fixed parameters
  wandb_switch:
    value: true
  grid_rows:
    value: 9
  grid_cols:
    value: 12

