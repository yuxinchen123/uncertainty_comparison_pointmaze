[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnd_exploration"
version = "0.1.0"
description = "SAC + switchable intrinsic-exploration bonuses on PointMaze, scored against an oracle visit-count field."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "gymnasium-robotics>=1.2.0",
    "stable-baselines3>=2.0.0",
    "wandb>=0.15.0",
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
