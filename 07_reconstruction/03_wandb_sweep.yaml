  rnd_obs_norm:
    values: [true]
  rnd_distance:
    values: ["mse", "abs"]
  rnd_input:
    values: ["position", "all"]
  rnd_output_dim:
    values: [128, 640]
  n_predictors:
    values: [1, 10]
  beta_std:
    values: [1.0, 5.0, 10.0]
